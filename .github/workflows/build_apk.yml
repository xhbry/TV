name: 自动编译签名APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode keystore
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > key.jks

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      -name: Add signing config
        run: |
          echo "storeFile=key.jks" >> local.properties
          echo "storePassword=${{ secrets.KEY_STORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleLeanbackRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Signed
          path: app/build/outputs/apk/leanback/release/*.apk
