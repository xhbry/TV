name: 自动编译签名APK

on:
  workflow_dispatch: # 允许手动触发
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 解码签名文件
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > app/keystore.jks

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 写入签名配置
        run: |
          cat >> app/keystore.properties << EOF
          storeFile=keystore.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 编译并签名电视版 Release APK
        run: ./gradlew assembleLeanbackRelease

      - name: 上传成品 APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Signed-APK
          path: app/build/outputs/apk/leanback/release/*.apk
