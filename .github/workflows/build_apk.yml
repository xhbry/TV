name: 编译FongMiTV签名APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 解码签名文件
        run: echo "${{ secrets.SIGNING_KEY }}" | base64 -d > keystore.jks

      - name: 配置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 写入签名配置
        run: |
          cat > keystore.properties << EOF
          storeFile=../keystore.jks
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          mv keystore.properties app/

      - name: 赋予执行权限
        run: chmod +x gradlew

      - name: 编译电视版Release
        run: ./gradlew assembleLeanbackRelease --no-build-cache

      - name: 上传成品APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-Signed-APK
          path: app/build/outputs/apk/leanback/release/*.apk
