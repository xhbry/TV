name: 编译FongMiTV（不签名版）
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v4

      - name: 配置JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 编译未签名APK
        run: chmod +x gradlew && ./gradlew assembleLeanbackDebug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: FongMi-TV-未签名
          path: app/build/outputs/apk/leanback/debug/*.apk
